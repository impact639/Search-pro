name: Build Debug APK

on:
  push:
    branches: [ main, master, 'feat/*', 'fix/*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Surface build error
        if: steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build failed"
            echo '```'
            grep -E "^e: |^w: |error:|Unresolved reference|What went wrong|> Task .*FAILED|FAILURE:|Compilation error|Execution failed|Caused by|Dagger|Hilt|Could not resolve" build.log | head -150
            echo '```'
            echo ''
            echo '```'
            tail -80 build.log
            echo '```'
          } > report.txt
          jq -n --rawfile body report.txt '{body: $body}' > comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @comment.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Fail job on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
